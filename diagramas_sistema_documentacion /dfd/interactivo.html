<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DFD · Sistema de Documentación</title>
<style>
:root{--bg:#eef0f3;--bar:#fff;--ink:#1d1d1f;--mute:#666;--line:#d5d8dd;--acc:#2d6a2d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Helvetica,Arial,sans-serif;height:100vh;display:flex;flex-direction:column}
header{background:var(--bar);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
h1{font-size:16px;margin:0;font-weight:700}
nav{display:flex;gap:6px;align-items:center;font-size:14px;flex-wrap:wrap}
nav a{color:#1a5fb4;cursor:pointer;text-decoration:none}
nav a:hover{text-decoration:underline}
nav span.sep{color:#999}
nav b{font-weight:600}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
.legend{margin-left:auto;display:flex;gap:14px;font-size:12px;color:var(--mute);align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;vertical-align:middle;margin-right:5px}
.lg-a{width:22px;height:14px;background:#dae8fc;border:1px solid #6c8ebf}
.lg-p{width:24px;height:14px;border-radius:50%;background:#d5e8d4;border:1px solid #82b366}
.lg-s{width:22px;height:14px;background:#fff2cc;border:1px solid #d6b656;border-right:none}
.lg-f{width:22px;height:0;border-top:1.5px solid #000;position:relative}
.lg-f:after{content:"";position:absolute;right:-2px;top:-5px;border-left:7px solid #000;border-top:4px solid transparent;border-bottom:4px solid transparent}
main{flex:1;min-height:0;padding:14px;display:flex}
#stage{flex:1;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;
 background-image:linear-gradient(#f3f3f3 1px,transparent 1px),linear-gradient(90deg,#f3f3f3 1px,transparent 1px);background-size:10px 10px}
#view{width:100%;height:100%;display:flex;align-items:center;justify-content:center;transition:transform .45s cubic-bezier(.4,0,.2,1),opacity .45s}
#view svg{width:100%;height:100%;display:block}
#view svg > rect:first-of-type{fill:transparent}
.proc{cursor:zoom-in}
.proc ellipse{transition:filter .15s,stroke-width .15s}
.proc:hover ellipse,.proc:focus ellipse{filter:drop-shadow(0 0 6px rgba(45,106,45,.55));stroke-width:2.5}
.proc:focus{outline:none}
.title{position:absolute;left:14px;top:10px;font-size:13px;color:var(--mute);background:rgba(255,255,255,.85);padding:3px 8px;border-radius:4px;pointer-events:none}
.tip{font-size:12px;color:var(--mute)}
@media (max-width:700px){.legend{margin-left:0}}
</style></head><body>

const SVG = DATA.svgs, META = Object.fromEntries(DATA.diagrams.map(d=>[d.id,d]));
const PARENT = {L1:"L0",L2_1:"L1",L2_2:"L1",L2_3:"L1",L2_4:"L1",L2_5:"L1"};
const SHORT = {L0:"Nivel 0",L1:"Nivel 1",L2_1:"1. Identidad y accesos",L2_2:"2. Repositorio y versiones",L2_3:"3. Revisión y aprobación",L2_4:"4. Organización y búsqueda",L2_5:"5. Auditoría y estadísticas"};
const view=document.getElementById('view'), crumbs=document.getElementById('crumbs'), up=document.getElementById('up'), ttl=document.getElementById('ttl');
let cur=null, busy=false;
function path(id){const p=[];while(id){p.unshift(id);id=PARENT[id];}return p;}
function render(id){
  view.innerHTML=SVG[id]; const s=view.querySelector('svg'); s.removeAttribute('width'); s.removeAttribute('height');
  s.setAttribute('preserveAspectRatio','xMidYMid meet');
  cur=id; ttl.textContent=META[id].title + (id.startsWith('L2')?'':'  ·  clic en un proceso para ampliarlo');
  up.disabled=!PARENT[id];
  crumbs.innerHTML=path(id).map((p,i,a)=>i<a.length-1?`<a data-id="${p}">${SHORT[p]}</a><span class="sep">›</span>`:`<b>${SHORT[p]}</b>`).join('');
  view.querySelectorAll('.proc').forEach(g=>{
    const go=()=>zoomIn(g); g.addEventListener('click',go);
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
  });
  try{history.replaceState(null,'','#'+id)}catch(e){}
}
function originOf(el){const r=el.getBoundingClientRect(), v=view.getBoundingClientRect();return `${r.left+r.width/2-v.left}px ${r.top+r.height/2-v.top}px`;}
function swap(id, outScale, inScale, origin){
  if(busy) return; busy=true;
  view.style.transformOrigin=origin||'50% 50%';
  view.style.transform=`scale(${outScale})`; view.style.opacity=0;
  setTimeout(()=>{
    view.style.transition='none'; render(id);
    view.style.transformOrigin='50% 50%'; view.style.transform=`scale(${inScale})`; view.style.opacity=0;
    void view.offsetWidth; view.style.transition='';
    view.style.transform='scale(1)'; view.style.opacity=1;
    setTimeout(()=>busy=false,460);
  },430);
}
function zoomIn(g){ if(g.dataset.go) swap(g.dataset.go, 3.2, .3, originOf(g)); }
function goUp(){ if(PARENT[cur]) swap(PARENT[cur], .3, 3.2); }
function goTo(id){ if(id===cur) return; path(cur).includes(id)?swap(id,.3,3.2):swap(id,3.2,.3); }
up.onclick=goUp;
crumbs.addEventListener('click',e=>{const a=e.target.closest('a'); if(a) goTo(a.dataset.id);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace') goUp();});
const start=(location.hash||'').slice(1); render(SVG[start]?start:'L0');
</script></body></html>
